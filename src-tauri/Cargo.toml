[package]
name = "rune-agents"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "rune_agents_lib"
crate-type = ["lib", "cdylib", "staticlib"]
